<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Walking Dead: Matric Proposal</title>
<!-- Phaser 3 Game Engine -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
  body {
    background: #050508;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #game-container {
    position: relative;
    width: 100%;
    max-width: 440px;
    background: #12131c;
    border: 3px solid #2d3748;
    border-radius: 12px;
    padding: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.95);
  }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1a202c;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: bold;
    margin-bottom: 6px;
    border-left: 4px solid #ed8936;
  }
  .stat-bar {
    width: 70px;
    height: 8px;
    background: #2d3748;
    border-radius: 4px;
    overflow: hidden;
    display: inline-block;
    vertical-align: middle;
  }
  .stat-fill-hp { height: 100%; width: 100%; background: #e53e3e; transition: width 0.2s; }
  .stat-fill-stamina { height: 100%; width: 100%; background: #38a169; transition: width 0.1s; }
  
  #phaser-canvas {
    border-radius: 6px;
    overflow: hidden;
    box-shadow: inset 0 0 12px #000;
  }

  .controls-panel {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .btn {
    flex: 1;
    background: #3182ce;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    touch-action: none;
  }
  .btn:active, .btn.active { transform: translateY(1px); background: #2b6cb0; }
  .btn-danger { background: #e53e3e; }
  .btn-success { background: #38a169; }

  .dpad-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    width: 150px;
  }
  .dpad-btn {
    background: #2d3748;
    color: white;
    border: 1px solid #4a5568;
    padding: 12px 0;
    font-size: 1.1rem;
    border-radius: 6px;
    font-weight: bold;
    text-align: center;
    touch-action: none;
  }
  .dpad-btn:active, .dpad-btn.active { background: #4a5568; color: #63b3ed; }

  .action-btns {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 140px;
  }

  .proposal-card {
    background: #1a202c;
    border: 3px solid #ed8936;
    padding: 24px 16px;
    border-radius: 10px;
    text-align: center;
    animation: fadeIn 0.8s ease-in-out;
  }
  @keyframes fadeIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
</style>
</head>
<body>

<div id="game-container">
  <div class="hud">
    <div>
      <span>HP </span><div class="stat-bar"><div id="hp-bar" class="stat-fill-hp"></div></div>
    </div>
    <div>
      <span>STM </span><div class="stat-bar"><div id="stm-bar" class="stat-fill-stamina"></div></div>
    </div>
    <span id="hud-stage">Stage 1: Outskirts</span>
  </div>

  <div id="phaser-canvas"></div>

  <div id="ui-panel" class="controls-panel"></div>
</div>

<script>
// --- GAME ENGINE SETUP ---
let gameState = {
  stage: 1,
  health: 100,
  stamina: 100,
  crates: 0,
  hasKatana: false,
  neganHp: 100,
  keys: { up: false, down: false, left: false, right: false, sprint: false, attack: false },
  puzzleState: [false, false, false]
};

const config = {
  type: Phaser.AUTO,
  width: 420,
  height: 250,
  parent: 'phaser-canvas',
  pixelArt: true,
  physics: { default: 'arcade', arcade: { debug: false } },
  scene: { preload: preload, create: create, update: update }
};

let gameScene, player, walkers = [], cratesList = [], darylObj, neganObj, gateObj, katanaSlashFx;

const game = new Phaser.Game(config);

function preload() {
  gameScene = this;

  // Stardew Valley Style Pixel Textures
  createTileTexture('grass_bg', '#274e13', '#1e3a0e');
  createTileTexture('compound_bg', '#343a40', '#212529');
  createTileTexture('forest_bg', '#1c2833', '#111822');
  createTileTexture('courtyard_bg', '#4a5568', '#2d3748');
  createTileTexture('sanctuary_bg', '#5c3a21', '#3b2312');
  
  // Character Textures
  createMichonneTexture();
  createWalkerTexture();
  createDarylTexture();
  createNeganTexture();
  createCrateTexture();
}

function create() {
  buildStageEnvironment(this);
  spawnStageEntities(this);
  updateUI();
}

function update() {
  if (!player || gameState.health <= 0) return;

  // Stamina Recovery
  if (!gameState.keys.sprint && gameState.stamina < 100) {
    gameState.stamina = Math.min(100, gameState.stamina + 0.25);
    updateBar('stm-bar', gameState.stamina);
  }

  // Top-Down Physics & Sprint Mechanics
  let isSprinting = gameState.keys.sprint && gameState.stamina > 5;
  let speed = isSprinting ? 140 : 85;

  if (isSprinting) {
    gameState.stamina = Math.max(0, gameState.stamina - 0.5);
    updateBar('stm-bar', gameState.stamina);
  }

  player.body.setVelocity(0);

  if (gameState.keys.left) { player.body.setVelocityX(-speed); player.flipX = true; }
  else if (gameState.keys.right) { player.body.setVelocityX(speed); player.flipX = false; }

  if (gameState.keys.up) { player.body.setVelocityY(-speed); }
  else if (gameState.keys.down) { player.body.setVelocityY(speed); }

  // Stage Specific Triggers
  if (gameState.stage === 1 && player.x > 385) {
    advanceStage(2);
  }
}

// --- PIXEL SPRITE GENERATORS ---
function createTileTexture(key, color1, color2) {
  let c = gameScene.textures.createCanvas(key, 16, 16);
  let ctx = c.context;
  ctx.fillStyle = color1; ctx.fillRect(0,0,16,16);
  ctx.fillStyle = color2; ctx.fillRect(0,0,8,8); ctx.fillRect(8,8,8,8);
  c.refresh();
}

function createMichonneTexture() {
  let c = gameScene.textures.createCanvas('michonne', 24, 32);
  let ctx = c.context;
  ctx.fillStyle = '#111'; ctx.fillRect(4,2,16,12); // Dreadlocks
  ctx.fillStyle = '#9b59b6'; ctx.fillRect(4,6,16,3); // Purple Headband
  ctx.fillStyle = '#6e473b'; ctx.fillRect(6,9,12,7); // Face
  ctx.fillStyle = '#d35400'; ctx.fillRect(4,16,16,10); // Tan Vest
  if (gameState.hasKatana) {
    ctx.fillStyle = '#bdc3c7'; ctx.fillRect(18,6,3,20); // Katana on back
  }
  c.refresh();
}

function createWalkerTexture() {
  let c = gameScene.textures.createCanvas('walker', 24, 32);
  let ctx = c.context;
  ctx.fillStyle = '#4a5d4e'; ctx.fillRect(6,4,12,10); // Rotting Skin
  ctx.fillStyle = '#e53e3e'; ctx.fillRect(8,8,2,2); ctx.fillRect(14,8,2,2); // Eyes
  ctx.fillStyle = '#2c3e50'; ctx.fillRect(4,14,16,12); // Blue Shirt
  c.refresh();
}

function createDarylTexture() {
  let c = gameScene.textures.createCanvas('daryl', 24, 32);
  let ctx = c.context;
  ctx.fillStyle = '#4a3728'; ctx.fillRect(6,2,12,8); // Hair
  ctx.fillStyle = '#e2e8f0'; ctx.fillRect(6,8,12,6); // Face
  ctx.fillStyle = '#2d3748'; ctx.fillRect(4,14,16,12); // Angel Vest
  ctx.fillStyle = '#ffffff'; ctx.fillRect(6,16,3,8); ctx.fillRect(15,16,3,8); // Wings
  c.refresh();
}

function createNeganTexture() {
  let c = gameScene.textures.createCanvas('negan', 24, 32);
  let ctx = c.context;
  ctx.fillStyle = '#1a202c'; ctx.fillRect(6,2,12,6); // Slick Hair
  ctx.fillStyle = '#edf2f7'; ctx.fillRect(6,8,12,6);
  ctx.fillStyle = '#e53e3e'; ctx.fillRect(6,14,12,3); // Red Scarf
  ctx.fillStyle = '#171923'; ctx.fillRect(4,17,16,10); // Leather Jacket
  ctx.fillStyle = '#8b5a2b'; ctx.fillRect(18,8,3,18); // Lucille
  c.refresh();
}

function createCrateTexture() {
  let c = gameScene.textures.createCanvas('crate', 20, 20);
  let ctx = c.context;
  ctx.fillStyle = '#795548'; ctx.fillRect(0,0,20,20);
  ctx.fillStyle = '#e53e3e'; ctx.fillRect(8,8,4,4); // Pulsing Red Light
  c.refresh();
}

// --- ENVIRONMENT BUILDER ---
function buildStageEnvironment(scene) {
  let bgKeys = ['grass_bg', 'compound_bg', 'forest_bg', 'courtyard_bg', 'sanctuary_bg'];
  let bgKey = bgKeys[gameState.stage - 1];

  for (let x = 0; x < 420; x += 16) {
    for (let y = 0; y < 250; y += 16) {
      scene.add.image(x, y, bgKey).setOrigin(0);
    }
  }

  if (gameState.stage === 1) {
    // Tall grass patches & gate
    scene.add.rectangle(408, 125, 12, 230, 0x4a5568);
  } else if (gameState.stage === 3) {
    // Campfire glow
    scene.add.circle(300, 125, 20, 0xed8936, 0.7);
  }
}

function spawnStageEntities(scene) {
  player = scene.physics.add.sprite(40, 125, 'michonne');
  player.setCollideWorldBounds(true);

  walkers = []; cratesList = [];

  if (gameState.stage === 1 || gameState.stage === 2) {
    let count = gameState.stage === 1 ? 4 : 3;
    for (let i = 0; i < count; i++) {
      let w = scene.physics.add.sprite(150 + i * 65, 40 + Math.random() * 160, 'walker');
      scene.physics.add.overlap(player, w, takeDamage, null, scene);
      walkers.push(w);
    }
  }

  if (gameState.stage === 2) {
    for (let i = 0; i < 3; i++) {
      let c = scene.physics.add.sprite(130 + i * 85, 50 + Math.random() * 130, 'crate');
      scene.physics.add.overlap(player, c, collectCrate, null, scene);
      cratesList.push(c);
    }
  }

  if (gameState.stage === 3) {
    darylObj = scene.add.sprite(300, 125, 'daryl');
  }

  if (gameState.stage === 4) {
    neganObj = scene.physics.add.sprite(290, 125, 'negan');
  }
}

function takeDamage() {
  gameState.health = Math.max(0, gameState.health - 0.4);
  updateBar('hp-bar', gameState.health);
  if (gameState.health <= 0) {
    player.disableBody(true, true);
    updateUI();
  }
}

function collectCrate(p, crate) {
  crate.destroy();
  gameState.crates++;
  if (gameState.crates >= 3) {
    advanceStage(3);
  }
  updateUI();
}

function advanceStage(next) {
  gameState.stage = next;
  gameScene.scene.restart();
}

function updateBar(id, val) {
  let el = document.getElementById(id);
  if (el) el.style.width = `${val}%`;
}

function updateUI() {
  let stageTitles = [
    "Stage 1: The Outskirts",
    "Stage 2: Supply Run",
    "Stage 3: The Exchange",
    "Stage 4: The Showdown",
    "Stage 5: The Sanctuary"
  ];
  document.getElementById("hud-stage").innerText = stageTitles[gameState.stage - 1];

  let panel = document.getElementById("ui-panel");

  if (gameState.health <= 0) {
    panel.innerHTML = `<button class="btn btn-danger" onclick="restartGame()">You Were Overrun! Tap to Retry</button>`;
    return;
  }

  if (gameState.stage === 1 || gameState.stage === 2) {
    panel.innerHTML = `
      <div class="dpad-container">
        <div class="dpad">
          <div></div><button class="dpad-btn" id="btn-up">⬆️</button><div></div>
          <button class="dpad-btn" id="btn-left">⬅️</button>
          <button class="dpad-btn" id="btn-down">⬇️</button>
          <button class="dpad-btn" id="btn-right">➡️</button>
        </div>
        <div class="action-btns">
          <button class="btn btn-success" id="btn-sprint">RUN 🏃</button>
        </div>
      </div>
    `;
    setupDpadControls();
  } else if (gameState.stage === 3) {
    if (!gameState.hasKatana) {
      panel.innerHTML = `<button class="btn btn-success" onclick="tradeDaryl()">Hand 3 Crates to Daryl for Katana</button>`;
    } else {
      panel.innerHTML = `<button class="btn btn-danger" onclick="slashAmbushWave()">Slash Ambushing Walker Wave!</button>`;
    }
  } else if (gameState.stage === 4) {
    panel.innerHTML = `
      <div class="btn-row">
        <button class="btn btn-danger" onclick="attackNegan('katana')">Katana Precision Strike</button>
        <button class="btn" onclick="attackNegan('dodge')">Dodge Lucille Swing</button>
      </div>
    `;
  } else if (gameState.stage === 5) {
    panel.innerHTML = `
      <div style="text-align:center; font-size:0.85rem; margin-bottom:4px;">Align 3 Survival Artifacts on Stone Altar:</div>
      <div class="btn-row">
        <button class="btn" onclick="solvePuzzle(0)">Place Compass</button>
        <button class="btn" onclick="solvePuzzle(1)">Place Pocket Watch</button>
        <button class="btn" onclick="solvePuzzle(2)">Place Sheriff Badge</button>
      </div>
    `;
  }
}

function setupDpadControls() {
  const map = { 'btn-up': 'up', 'btn-down': 'down', 'btn-left': 'left', 'btn-right': 'right' };
  Object.keys(map).forEach(id => {
    let el = document.getElementById(id);
    if (!el) return;
    let k = map[id];
    let start = (e) => { e.preventDefault(); gameState.keys[k] = true; el.classList.add('active'); };
    let end = (e) => { e.preventDefault(); gameState.keys[k] = false; el.classList.remove('active'); };
    el.addEventListener('touchstart', start, {passive:false});
    el.addEventListener('touchend', end, {passive:false});
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
  });

  let sp = document.getElementById('btn-sprint');
  if (sp) {
    let start = (e) => { e.preventDefault(); gameState.keys.sprint = true; sp.classList.add('active'); };
    let end = (e) => { e.preventDefault(); gameState.keys.sprint = false; sp.classList.remove('active'); };
    sp.addEventListener('touchstart', start, {passive:false});
    sp.addEventListener('touchend', end, {passive:false});
    sp.addEventListener('mousedown', start);
    sp.addEventListener('mouseup', end);
  }
}

function tradeDaryl() {
  gameState.hasKatana = true;
  createMichonneTexture();
  updateUI();
}

function slashAmbushWave() {
  advanceStage(4);
}

function attackNegan(type) {
  if (type === 'katana') {
    gameState.neganHp -= 35;
    gameState.health -= 8;
  } else {
    gameState.neganHp -= 20;
  }

  updateBar('hp-bar', gameState.health);

  if (gameState.neganHp <= 0) {
    advanceStage(5);
  } else {
    updateUI();
  }
}

function solvePuzzle(index) {
  gameState.puzzleState[index] = true;
  if (gameState.puzzleState.every(Boolean)) {
    triggerProposal();
  } else {
    alert(`Artifact ${index + 1} placed! Keep going...`);
  }
}

function restartGame() {
  gameState = { stage: 1, health: 100, stamina: 100, crates: 0, hasKatana: false, neganHp: 100, keys: { up: false, down: false, left: false, right: false, sprint: false, attack: false }, puzzleState: [false, false, false] };
  gameScene.scene.restart();
}

function triggerProposal() {
  document.getElementById("game-container").innerHTML = `
    <div class="proposal-card">
      <h1 style="color:#ed8936; font-size:1.2rem; margin-bottom:12px;">VAULT OPENED</h1>
      <p style="font-size: 1rem; line-height: 1.5; color: #edf2f7; margin-bottom: 18px;">
        "Out of 8 billion people, I'd still choose YOU to survive the apocalypse with."
      </p>
      <hr style="border:0; border-top:1px solid #4a5568; margin: 15px 0;">
      <h2 style="color: #63b3ed; font-size: 1.1rem; margin-bottom: 20px;">
        Will you be my Rick to my Michonne at Matric Dance?
      </h2>
      <button class="btn btn-success" onclick="alert('YES! ❤️ Best apocalyptic date ever!')">YES! ❤️</button>
    </div>
  `;
}
</script>
</body>
</html>
